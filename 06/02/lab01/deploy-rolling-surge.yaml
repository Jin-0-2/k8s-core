apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-surge
  namespace: lab01
spec:
  replicas: 4
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0%
      maxSurge: 25%

  selector:
    matchLabels:
      app: nginx
  
  # Pod; Pod.yaml에서 apiVersion, kind 제외 metadata 부터 붙여넣기 (name, namespace 빼고)
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.30
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3