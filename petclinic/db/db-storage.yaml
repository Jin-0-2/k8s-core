apiVersion: v1
kind: PersistentVolume
metadata:
  name: petclinic-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-db
  local:
    path: /data/petclinic-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - worker1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: petclinic
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-db
  resources:
    requests:
      storage: 5Gi